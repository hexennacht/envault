name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'Force a version bump (patch, minor, major)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --all-targets --all-features

  tag-and-release:
    name: Tag & Create Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      version: ${{ steps.resolve_tag.outputs.version }}
      release_created: ${{ steps.resolve_tag.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        if: github.ref_type == 'branch'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          force_bump: ${{ inputs.force_bump || '' }}
          initial_version: 0.0.0
          release_branches: main

      - name: Resolve release tag and version
        id: resolve_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.tag_version.outputs.new_tag }}" ]; then
            echo "tag=${{ steps.tag_version.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.tag_version.outputs.new_version }}" >> "$GITHUB_OUTPUT"
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Draft GitHub Release
        if: steps.resolve_tag.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: Release ${{ steps.resolve_tag.outputs.tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          draft: true
          generate_release_notes: ${{ steps.tag_version.outputs.changelog == '' }}

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: tag-and-release
    if: needs.tag-and-release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync version to Cargo.toml
        if: needs.tag-and-release.outputs.version != ''
        shell: bash
        run: |
          VERSION="${{ needs.tag-and-release.outputs.version }}"
          perl -pi -e "s/^version = \".*\"/version = \"$VERSION\"/ if /version = / and !\$done++" Cargo.toml

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: envault
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: LICENSE-MIT,README.md
          ref: refs/tags/${{ needs.tag-and-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: [tag-and-release, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-and-release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
